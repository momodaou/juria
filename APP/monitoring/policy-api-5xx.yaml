displayName: "JURIA API — taux d'erreurs 5xx élevé"
combiner: OR
conditions:
  - displayName: "Plus de 5 erreurs serveur en 5 minutes"
    conditionThreshold:
      filter: >-
        resource.type="cloud_run_revision" AND
        resource.label."service_name"="juria" AND
        metric.type="run.googleapis.com/request_count" AND
        metric.label."response_code_class"="5xx"
      comparison: COMPARISON_GT
      thresholdValue: 5
      duration: 0s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_SUM
          crossSeriesReducer: REDUCE_SUM
          groupByFields:
            - "resource.label.service_name"
      trigger:
        count: 1
notificationChannels:
  - "projects/jfc-juria/notificationChannels/16089389092260988572"
alertStrategy:
  autoClose: 604800s
